version: 2

models:
  - name: stg_patients
    description: "One row per patient. Contains PII; de-identified downstream."
    columns:
      - name: patient_id
        tests: [unique, not_null]

  - name: stg_encounters
    description: "One row per encounter (visit)."
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id

  - name: stg_conditions
    description: "One row per diagnosed condition (SNOMED CT)."
    columns:
      - name: condition_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id

  - name: stg_observations
    description: "One row per observation (vitals, labs, surveys; LOINC)."
    columns:
      - name: observation_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id